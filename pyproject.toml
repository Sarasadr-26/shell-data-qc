[project]
name = "project-template"
version = "0.1.0"
description = "Reusable starting point for portfolio projects"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3",
    "pandas>=2.3",
    "scikit-learn>=1.7",
    "matplotlib>=3.10",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel>=6.30",
]
